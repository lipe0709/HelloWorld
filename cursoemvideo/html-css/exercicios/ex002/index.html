<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos</title>
</head>
<body>
    <h1>Parágrafos e quebras de linha</h1>
    <hr>
    <p>Você pode escrever
        um 
        parágrafo de qualquer
        jeito,
         quem manda na parada
        é
        a
        marcação (tag
        ).
    </p>
    <p>Se quiser quebrar uma linha <br> como essa, basta usar a tag &lt;br&gt;.</p>
    <p>Vamos adicionar alguns caracteres especiais: 
        <br>&nbsp;
        <br>&reg;
        <br>&copy;
        <br>&trade;
        <br>&euro;
        <br>&cent;
        <br>&delta;
        <br>&Delta;
        <br>&sum;
        <p>Agora, alguns emoji:</p>
        <br>&#x2764;
        <br>&#x2705;
        <br>&#x1F525;
        <br>&#x1F602;
        <br>&#x1F440;
    </p>
</body>
</html>
